[package]
name = "replay"
version = "0.1.0"
description = "RePlay — just music. A quiet music player in the ReNote style."
authors = ["Artur Savytskyi"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["macos-private-api"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
lofty = "0.25.5"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
dirs = "7.0.0"
rodio = { version = "0.23.0", features = ["symphonia-all"] }
# the radio: Radio Browser's list of stations, and their streams
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder"] }
